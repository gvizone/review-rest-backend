services:
  app:
    build: .
    restart: always
    expose:
      - '3000' # interno apenas
    env_file:
      - production.env

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80' # só o Nginx fica exposto
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
