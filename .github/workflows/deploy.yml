name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'EOS'
          set -euxo pipefail

          readonly APP_USER="ubuntu"
          readonly REPO_DIR="/home/ubuntu/review-rest-backend"

          echo "=== deploy: start ==="
          date -Is
          whoami
          uname -a

          echo "=== deploy: cd repo ==="
          ls -ld "$REPO_DIR" || true
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && pwd"

          echo "=== deploy: git pull ==="
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && git rev-parse --short HEAD || true"
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && git pull origin master"
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && git rev-parse --short HEAD"

          echo "=== deploy: docker compose down ==="
          sudo bash -lc "cd '$REPO_DIR' && docker compose down"

          echo "=== deploy: docker compose up (build) ==="
          sudo bash -lc "cd '$REPO_DIR' && docker compose up -d --build"

          echo "=== deploy: docker status ==="
          sudo bash -lc "cd '$REPO_DIR' && docker compose ps"

          echo "=== deploy: docker image prune ==="
          sudo docker image prune -f

          echo "=== deploy: done ==="
          date -Is
          EOS
          )

          REMOTE_SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 1200 \
            --comment "GitHub Actions deploy: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --parameters "{\"commands\":[\"echo '$REMOTE_SCRIPT_B64' | base64 -d | bash\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Polling manual — aguarda até 10 minutos
          for i in $(seq 1 40); do
            read -r STATUS STATUS_DETAILS RESPONSE_CODE < <(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "[Status,StatusDetails,ResponseCode]" \
                --output text 2>/dev/null || echo "Pending Pending -1"
            )

            echo "[$i/40] Status: $STATUS | Details: $STATUS_DETAILS | ResponseCode: $RESPONSE_CODE"

            if [ "$STATUS" = "Success" ]; then
              echo "SSM reported Success. Fetching full stdout/stderr."
              STDOUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text || true)
              STDERR=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text || true)

              echo "----- stdout (SSM) -----"
              printf '%s\n' "$STDOUT"
              echo "----- stderr (SSM) -----"
              printf '%s\n' "$STDERR"

              if [ "${RESPONSE_CODE:-0}" != "0" ]; then
                echo "❌ Deploy finished but ResponseCode is non-zero: $RESPONSE_CODE"
                exit 1
              fi

              echo "✅ Deploy concluído!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deploy falhou com status: $STATUS"
              echo "----- stdout (SSM) -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text || true
              echo "----- stderr (SSM) -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi

            sleep 15
          done

          echo "❌ Timeout: deploy demorou mais de 10 minutos"
          exit 1
