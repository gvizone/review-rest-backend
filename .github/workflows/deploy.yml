name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/review-rest-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/review-rest-backend:latest

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          OWNER_LC="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          readonly APP_IMAGE="ghcr.io/${OWNER_LC}/review-rest-backend:${GITHUB_SHA}"

          REMOTE_SCRIPT=$(cat <<'EOS'
          set -euxo pipefail

          readonly APP_USER="ubuntu"
          readonly REPO_DIR="/home/ubuntu/review-rest-backend"
          readonly APP_IMAGE="__APP_IMAGE__"

          echo "=== deploy: start ==="
          date -Is
          whoami
          uname -a

          echo "=== deploy: cd repo ==="
          ls -ld "$REPO_DIR" || true
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && pwd"

          echo "=== deploy: git pull ==="
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && git rev-parse --short HEAD || true"
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && git pull origin master"
          sudo -u "$APP_USER" -H bash -lc "cd '$REPO_DIR' && git rev-parse --short HEAD"

          echo "=== deploy: docker compose pull (app image) ==="
          sudo bash -lc "cd '$REPO_DIR' && APP_IMAGE='$APP_IMAGE' docker compose pull app"

          echo "=== deploy: docker compose up (no build) ==="
          sudo bash -lc "cd '$REPO_DIR' && APP_IMAGE='$APP_IMAGE' docker compose up -d --no-build"

          echo "=== deploy: docker status ==="
          sudo bash -lc "cd '$REPO_DIR' && APP_IMAGE='$APP_IMAGE' docker compose ps"

          echo "=== deploy: docker image prune ==="
          sudo docker image prune -f

          echo "=== deploy: done ==="
          date -Is
          EOS
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT/__APP_IMAGE__/${APP_IMAGE}}"

          REMOTE_SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --comment "GitHub Actions deploy: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --parameters "{\"commands\":[\"echo '$REMOTE_SCRIPT_B64' | base64 -d | bash\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Polling manual — aguarda até 10 minutos (600s)
          PREV_STDOUT_HASH=""
          PREV_STDERR_HASH=""

          for i in $(seq 1 60); do
            read -r STATUS STATUS_DETAILS RESPONSE_CODE < <(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "[Status,StatusDetails,ResponseCode]" \
                --output text 2>/dev/null || echo "Pending Pending -1"
            )

            echo "[$i/60] Status: $STATUS | Details: $STATUS_DETAILS | ResponseCode: $RESPONSE_CODE"

            # While running, surface output as it changes.
            if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ]; then
              CUR_STDOUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text 2>/dev/null || true)
              CUR_STDERR=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text 2>/dev/null || true)

              CUR_STDOUT_HASH=$(printf '%s' "$CUR_STDOUT" | sha256sum | awk '{print $1}')
              CUR_STDERR_HASH=$(printf '%s' "$CUR_STDERR" | sha256sum | awk '{print $1}')

              if [ "$CUR_STDOUT_HASH" != "$PREV_STDOUT_HASH" ]; then
                echo "----- stdout update (SSM) -----"
                printf '%s\n' "$CUR_STDOUT"
                PREV_STDOUT_HASH="$CUR_STDOUT_HASH"
              fi

              if [ "$CUR_STDERR_HASH" != "$PREV_STDERR_HASH" ]; then
                echo "----- stderr update (SSM) -----"
                printf '%s\n' "$CUR_STDERR"
                PREV_STDERR_HASH="$CUR_STDERR_HASH"
              fi
            fi

            if [ "$STATUS" = "Success" ]; then
              echo "SSM reported Success. Fetching full stdout/stderr."
              STDOUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text || true)
              STDERR=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text || true)

              echo "----- stdout (SSM) -----"
              printf '%s\n' "$STDOUT"
              echo "----- stderr (SSM) -----"
              printf '%s\n' "$STDERR"

              if [ "${RESPONSE_CODE:-0}" != "0" ]; then
                echo "❌ Deploy finished but ResponseCode is non-zero: $RESPONSE_CODE"
                exit 1
              fi

              echo "✅ Deploy concluído!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deploy falhou com status: $STATUS"
              echo "----- stdout (SSM) -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text || true
              echo "----- stderr (SSM) -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text || true

              echo "----- diagnostics: amazon-ssm-agent logs -----"
              DIAG_CMD_ID=$(aws ssm send-command \
                --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                --document-name "AWS-RunShellScript" \
                --timeout-seconds 120 \
                --comment "Diagnostics: amazon-ssm-agent logs" \
                --parameters 'commands=[
                  "set -euxo pipefail",
                  "sudo systemctl status amazon-ssm-agent --no-pager || true",
                  "sudo journalctl -u amazon-ssm-agent -n 200 --no-pager || true",
                  "sudo ls -la /var/log/amazon/ssm || true",
                  "sudo tail -n 200 /var/log/amazon/ssm/amazon-ssm-agent.log || true",
                  "sudo tail -n 200 /var/log/amazon/ssm/errors.log || true"
                ]' \
                --query "Command.CommandId" \
                --output text || true)

              if [ -n "${DIAG_CMD_ID:-}" ] && [ "$DIAG_CMD_ID" != "None" ]; then
                for j in $(seq 1 12); do
                  DIAG_STATUS=$(aws ssm get-command-invocation \
                    --command-id "$DIAG_CMD_ID" \
                    --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                    --query "Status" \
                    --output text 2>/dev/null || echo "Pending")

                  if [ "$DIAG_STATUS" = "Success" ] || [ "$DIAG_STATUS" = "Failed" ]; then
                    echo "Diagnostics status: $DIAG_STATUS"
                    echo "----- diagnostics stdout -----"
                    aws ssm get-command-invocation \
                      --command-id "$DIAG_CMD_ID" \
                      --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                      --query "StandardOutputContent" \
                      --output text || true
                    echo "----- diagnostics stderr -----"
                    aws ssm get-command-invocation \
                      --command-id "$DIAG_CMD_ID" \
                      --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                      --query "StandardErrorContent" \
                      --output text || true
                    break
                  fi

                  sleep 5
                done
              fi
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timeout: deploy demorou mais de 10 minutos"
          exit 1
